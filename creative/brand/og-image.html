<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>ClearPath share image source (1200 x 630, not a public page)</title>
<!-- Rendered by tools/render-brand.mjs into /og-image.png. Replaces the
     September share image, whose tagline carried the retired universal
     "nothing leaves without your okay" promise. Approved logo raster only. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#555}
  #stage{position:relative;width:1200px;height:630px;background:#F8F5EF;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#0C1B2E;-webkit-font-smoothing:antialiased}
  .logo{position:absolute;left:96px;top:70px;width:470px;aspect-ratio:3.8/1;overflow:hidden}
  .logo img{position:absolute;width:125%;left:-12.5%;top:-317%;max-width:none;mix-blend-mode:darken}
  .rule{position:absolute;left:96px;right:96px;top:236px;height:1px;background:#0C1B2E}
  h1{position:absolute;left:96px;top:268px;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-size:72px;line-height:1.05;letter-spacing:-1px;font-weight:700}
  p{position:absolute;left:96px;top:380px;width:900px;font-size:30px;line-height:1.4;color:#46535F}
  p b{color:#0C1B2E;font-weight:600}
  .foot{position:absolute;left:96px;bottom:60px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:#0A6A62}
  .mark{position:absolute;right:96px;bottom:66px;width:120px;height:2px;background:#0B7B72}
  .mark::after{content:"";position:absolute;right:-12px;top:-5px;width:12px;height:12px;border-radius:50%;background:#0B7B72}
</style>
</head>
<body>
<div id="stage">
  <div class="logo"><img src="../../clearpath-logo.png" alt=""></div>
  <div class="rule"></div>
  <h1>Bring me the messy work.</h1>
  <p>Websites, practical tools and ongoing support for owner-led businesses. <b>Scope and price agreed before work starts.</b></p>
  <div class="foot">Ellicottville, NY &middot; Western New York &middot; clearpathwv.com</div>
  <div class="mark"></div>
</div>
</body>
</html>
